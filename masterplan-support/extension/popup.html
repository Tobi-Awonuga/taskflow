<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CT Bakery — Item Guard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      color: #1a1a1a;
      background: #fff;
    }

    header {
      background: #c0392b;
      color: #fff;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    header .logo { font-size: 20px; }

    header .info { flex: 1; }

    header .info h1 {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.2;
    }

    header .info p {
      font-size: 11px;
      opacity: 0.85;
      margin-top: 2px;
    }

    main { padding: 14px; }

    /* Status badge */
    #status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      padding: 8px 10px;
      border-radius: 6px;
      background: #f5f5f5;
      border: 1px solid #e0e0e0;
    }

    #status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      background: #aaa;
    }

    #status-dot.connected    { background: #27ae60; }
    #status-dot.disconnected { background: #c0392b; }

    #status-text {
      font-size: 12px;
      color: #555;
      line-height: 1.4;
    }

    /* Form */
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 4px;
    }

    input[type="text"],
    input[type="password"],
    input[type="email"],
    input[type="url"] {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
      font-family: inherit;
      color: #1a1a1a;
      margin-bottom: 10px;
      outline: none;
    }

    input:focus {
      border-color: #c0392b;
      box-shadow: 0 0 0 2px rgba(192, 57, 43, 0.15);
    }

    button {
      width: 100%;
      padding: 8px 12px;
      background: #c0392b;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      margin-bottom: 6px;
    }

    button:hover  { background: #a93226; }
    button:disabled { background: #aaa; cursor: not-allowed; }

    button.secondary {
      background: none;
      color: #c0392b;
      border: 1px solid #c0392b;
    }

    button.secondary:hover { background: #fef0ef; }

    #msg {
      min-height: 16px;
      font-size: 12px;
      margin-top: 4px;
      border-radius: 3px;
    }

    #msg.error   { color: #c0392b; }
    #msg.success { color: #27ae60; font-weight: 600; }
    #msg.info    { color: #555; font-style: italic; }

    hr {
      border: none;
      border-top: 1px solid #eee;
      margin: 14px 0;
    }

    .field-group { margin-bottom: 2px; }

    footer {
      padding: 8px 14px;
      border-top: 1px solid #eee;
      text-align: center;
      font-size: 11px;
      color: #aaa;
    }

    /* Logged-in view */
    #user-info {
      padding: 8px 10px;
      background: #f0faf4;
      border: 1px solid #c3e6cb;
      border-radius: 6px;
      margin-bottom: 12px;
    }

    #user-info strong { color: #155724; font-size: 13px; }
    #user-info span   { display: block; font-size: 11px; color: #555; margin-top: 2px; }
  </style>
</head>
<body>
  <header>
    <span class="logo">🍞</span>
    <div class="info">
      <h1>Item Creation Guard</h1>
      <p>CT Bakery — Masterplan</p>
    </div>
  </header>

  <main>
    <!-- Connection status -->
    <div id="status-row">
      <div id="status-dot"></div>
      <div id="status-text">Checking connection…</div>
    </div>

    <!-- Logged-in view -->
    <div id="logged-in-view" hidden>
      <div id="user-info">
        <strong id="user-name">—</strong>
        <span id="user-role">—</span>
      </div>
      <button id="logout-btn" class="secondary">Sign out</button>
    </div>

    <!-- Login view -->
    <div id="login-view">
      <div class="field-group">
        <label for="email-input">Portal Email</label>
        <input id="email-input" type="email" placeholder="you@ctbakery.com" autocomplete="username" />
      </div>
      <div class="field-group">
        <label for="password-input">Password</label>
        <input id="password-input" type="password" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <button id="login-btn">Sign in</button>
      <div id="msg"></div>
    </div>

    <hr />

    <!-- Backend URL -->
    <div class="field-group">
      <label for="backend-url">Portal Backend URL</label>
      <input id="backend-url" type="url" placeholder="http://localhost:3001" autocomplete="off" />
    </div>
    <button id="save-url-btn" class="secondary">Save URL</button>
  </main>

  <footer>CT Bakery Support Layer — Item Guard v1.0</footer>

  <script src="popup.js"></script>
</body>
</html>
